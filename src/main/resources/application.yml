spring:
  application:
    name: sea-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: com.sea.backend.config.SQLiteDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:yCfuNSDLw5dsS1X9BPyN8d0S434U-gbo504uejd_lm2ZhvvBWdU9bx4oBXFJhDt0}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
